[package]
name = "tcg_layout"
version = "0.1.0"
edition = "2021"

[dependencies]
egui = "0.28"
eframe = { version = "0.28", default-features = false, features = [
    "accesskit",     # Make egui compatible with screen readers
    "default_fonts", # Embed the default egui fonts
    "glow",          # Use glow rendering backend
    "persistence",   # Enable restoring app state when restarting the app
] }
image = { version = "0.25", features = ["jpeg", "png", "tiff"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
rfd = "0.14"  # File dialogs
kamadak-exif = "0.5"  # EXIF reading for DPI
lru = "0.12"  # LRU cache
env_logger = "0.11"
svg = "0.14"  # SVG generation

[dev-dependencies]
tempfile = "3.8"  # For creating test files
